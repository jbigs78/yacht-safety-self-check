<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Yacht safety equipment self-check</title><style>
:root{--navy:#0b3a5b;--blue:#1565a0;--bg:#f3f6f9;--card:#fff;--line:#d8e0e8;--text:#1b2733;--muted:#5d6b78;--ok:#1e7d3a;--okbg:#e3f4e8;--warn:#8a5800;--warnbg:#fff1cf;--bad:#b3261e;--badbg:#fde7e5;--info:#e6f0f8}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0}
.brand{display:flex;align-items:center;gap:12px}
.logo{height:48px;width:auto;max-width:140px;object-fit:contain;background:#fff;border-radius:6px;padding:3px}
.rlogo{height:64px;width:auto;max-width:180px;object-fit:contain}
header small{opacity:.8;display:block;font-size:12px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff}
nav button.active{background:#fff;color:var(--navy)}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:16px 0 8px;color:var(--navy)}
.card>h3:first-child{margin-top:0}
button,.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 12px;border-radius:7px;cursor:pointer;text-decoration:none;display:inline-block}
.primary{background:var(--blue)!important;border-color:var(--blue)!important;color:#fff!important}
button.danger{color:var(--bad);border-color:#e8b4b0}
button.small{padding:3px 9px;font-size:13px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;width:100%;background:#fff;color:var(--text)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
label.check{display:flex;gap:8px;align-items:center;color:var(--text);font-size:15px;margin:4px 0}
label.check input{width:auto}
a{color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);white-space:nowrap}
td input,td select{min-width:110px}
tr.click{cursor:pointer}
tr.click:hover{background:var(--info)}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.big{font-size:16px;padding:4px 14px}
.ok{background:var(--okbg);color:var(--ok)}
.soon{background:var(--warnbg);color:var(--warn)}
.bad{background:var(--badbg);color:var(--bad)}
.muted-chip{background:#eef1f4;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:10px 6px;border-bottom:1px solid var(--line)}
.item .note,.item .expd{grid-column:1/-1}
.item.invalid{background:var(--badbg);border-radius:6px}
.reg{display:inline-block;min-width:54px;font-size:12px;font-weight:600;color:var(--blue);margin-right:6px}
.hints{margin-top:4px}
.expd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.expd label{margin:0}
.expd input{width:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;align-self:start}
.seg label{margin:0;padding:0;color:var(--text);font-size:14px;cursor:pointer;position:relative}
.seg label+label{border-left:1px solid var(--line)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:6px 14px}
.seg .p input:checked+span{background:var(--ok);color:#fff}
.seg .f input:checked+span{background:var(--bad);color:#fff}
.seg .n input:checked+span{background:#6b7785;color:#fff}
.invalid{border-color:var(--bad)!important;box-shadow:0 0 0 2px var(--badbg)}
.banner{padding:10px 12px;border-radius:8px;margin-bottom:12px;background:var(--info)}
.banner.badb{background:var(--badbg);color:var(--bad)}
.banner ul{margin:6px 0 0;padding-left:20px}
.decl{overflow-wrap:anywhere;font-size:13px;color:var(--muted);background:#f7f9fb;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}
.kv div{font-size:14px}.kv b{display:block;font-size:12px;color:var(--muted);font-weight:500}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:30px}
.sig div{border-top:1px solid var(--text);padding-top:4px;font-size:13px}
.pa{width:46px;text-align:center}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
code{background:#eef1f4;padding:1px 5px;border-radius:4px}
@media(max-width:600px){.item{grid-template-columns:1fr}main{padding:10px}}
@media print{header,.noprint{display:none!important}body{background:#fff}.card{border:0;padding:0}main{padding:0}tr{break-inside:avoid}.formblock{break-before:page}input{border:0;padding:0}}
</style></head>

function ownerDataFromPayload(P, RAW, C){
  const forms = {};
  for(const key in RAW){
    const f = RAW[key], seen = {}, items = [];
    const sections = f.sections.map(([title, list]) => ({title, items: list.map(([reg, text, o]) => {
      const base = key+':'+reg; seen[base] = (seen[base]||0) + 1;
      const it = {id: base + (seen[base] > 1 ? '#'+seen[base] : ''), reg, text, ...(o||{})}; items.push(it); return it; })}));
    let h = 0; for(const ch of items.map(i => i.id).join('|')) h = (h*31 + ch.charCodeAt(0)) | 0;
    forms[key] = {...f, key, sections, items, sig:(h>>>0).toString(36)};
  }
  const y = P.y, cat = +y.category, ok = i => (!i.c || [].concat(i.c).some(f => P.ft[f])) && (!i.k || i.k.includes(cat));
  const keys = [cat === 7 ? 'cat7' : 'cat4', {inshore:'medInshore', coastal1:'medCoastal1'}[P.sel.medKit], P.sel.radio && 'radio', P.sel.keel && 'keel']
    .filter(k => k && forms[k] && forms[k].owner);
  return {v:2, generated:P.g, warnDays:P.w, web3formsKey:P.k||'', logo:C.logo, sel:P.sel, auditor:P.au,
    yacht:{id:y.id, name:y.name, sailNo:y.sailNo, club:y.club, category:cat, owner:y.owner||'', ownerEmail:y.email||'', ownerPhone:y.phone||''},
    boat:P.boat, boatFields:C.boatFields, decl:C.decl, plText:C.plText, prevE:P.pE||{}, prevX:P.pX||{}, prevIns:P.pI||{insurer:'', renew:''},
    mismatch:keys.filter(k => P.sg && P.sg[k] && P.sg[k] !== forms[k].sig),
    forms:keys.map(k => { const f = forms[k];
      return {key:k, title:f.title, sub:f.sub, ver:f.ver, sig:f.sig, decl:f.decl, expiry:f.expiry||[], order:f.items.map(i => i.id),
        sections:f.sections.map(s => ({title:s.title, items:s.items.filter(ok).map(({id,reg,text,ex,ph,p}) => ({id,reg,text,ex,ph,p}))})).filter(s => s.items.length)}; })};
}
function ownerApp(){
  const D = DATA, KEY = 'yachtSelfCheck2.'+D.yacht.id+'.'+D.generated, app = document.getElementById('app');
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
  const isDate = v => /^\d{4}-\d\d-\d\d$/.test(v||'');
  const fmt = iso => isDate(iso) ? new Date(iso+'T00:00').toLocaleDateString('en-AU',{day:'2-digit',month:'short',year:'numeric'}) : (iso||'—');
  const days = (a,b) => Math.round((new Date(b+'T00:00') - new Date(a+'T00:00'))/864e5);
  const status = d => !d ? 'missing' : d < today() ? 'expired' : days(today(), d) <= D.warnDays ? 'soon' : 'ok';
  const chip = d => ({missing:'', expired:'<span class="chip bad">Expired</span>', soon:'<span class="chip soon">Expires soon</span>', ok:'<span class="chip ok">In date</span>'})[status(d)];
  const allItems = D.forms.flatMap(f => f.sections.flatMap(s => s.items));
  const exRows = D.forms.flatMap(f => f.expiry.map(e => ({k:f.key+'.'+e.id, label:e.label})));
  const fresh = () => ({owner:D.yacht.owner||'', email:D.yacht.ownerEmail||'', phone:D.yacht.ownerPhone||'', boat:Object.assign({}, D.boat),
    answers:Object.fromEntries(allItems.map(i => [i.id, {a:'', n:'', e:i.ex ? (D.prevE[i.id]||'') : ''}])),
    earliest:Object.fromEntries(exRows.map(r => [r.k, {v:D.prevX[r.k]||''}])),
    ins:{insurer:D.prevIns.insurer, renew:D.prevIns.renew, pl:false}, declName:'', declared:false, done:false});
  let st = null;
  try{ st = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!st) st = fresh();
  st.ins = st.ins || {insurer:'', renew:'', pl:false};
  const persist = () => { try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} };
  const head = `<header><div class="brand">${D.logo?`<img class="logo" src="${D.logo}" alt="">`:''}<div><h1>Safety equipment self-check</h1><small>Australian Sailing Special Regulations – Category ${D.yacht.category}</small></div></div></header>`;

  function itemHtml(i){

    return `<div class="item" data-item="${i.id}" id="it_${i.id.replace(/[^\w]/g,'_')}"><div><span class="reg">${esc(i.reg)}</span>${esc(i.text)}</div>
      <div class="seg">${[['yes','Yes','p'],['no','No','f'],['na','N/A','n']].map(([v,l,c]) => `<label class="${c}"><input type="radio" name="a_${i.id}" value="${v}" ${a.a===v?'checked':''}><span>${l}</span></label>`).join('')}</div>
      ${i.ex?`<div class="expd"><label>Expiry date</label><input type="date" class="exd" value="${esc(a.e)}"><span class="st">${chip(a.e)}</span></div>`:''}
      <input class="note" placeholder="${a.a==='no'?'Required: what is missing and what you are doing about it':esc(i.ph||'Comment (optional)')}" value="${esc(a.n)}"></div>`;
  }
  function exTable(f){
    if(!f.expiry.length) return '';
    return `<h3>Earliest expiry dates</h3><p class="muted">For each item, enter the earliest expiry date of all units on board (e.g. the oldest flare), or choose Hire or N/A.</p>
      <div class="scroll"><table><tbody>${f.expiry.map(e => { const k = f.key+'.'+e.id, x = st.earliest[k] || {v:''}, mode = ['hire','n/a'].includes(x.v) ? x.v : x.v ? 'date' : '';
        return `<tr data-ex="${k}"><td>${esc(e.label)}</td><td><div class="row" style="flex-wrap:nowrap"><select class="exm" style="width:90px;min-width:90px">${[['','–'],['date','Date'],['hire','Hire'],['n/a','N/A']].map(([v,l]) => `<option value="${v}" ${mode===v?'selected':''}>${l}</option>`).join('')}</select>
          <input type="date" class="exv" value="${mode==='date'?esc(x.v):''}" ${mode!=='date'?'hidden':''}></div></td><td class="st">${mode==='date'?chip(x.v):''}</td></tr>`; }).join('')}</tbody></table></div>`;
  }

        Enter the earliest expiry dates and the expiry dates of first aid medications, then press <b>Check &amp; send to auditor</b>. Your answers are saved in this browser as you go.</p></div>
      <div class="card"><h3>Owner details</h3><div class="grid">
        <div><label>Owner(s) name(s) *</label><input data-s="owner" value="${esc(st.owner)}"></div>
        <div><label>Email *</label><input data-s="email" type="email" value="${esc(st.email)}"></div>
        <div><label>Phone</label><input data-s="phone" type="tel" value="${esc(st.phone)}"></div></div>
        <h3>Boat details</h3><div class="grid">${D.boatFields.map(([k,l,o]) => o === 'check'
          ? `<label class="check"><input type="checkbox" data-b="${k}" ${st.boat[k]?'checked':''}> ${esc(l)}</label>`
          : Array.isArray(o) ? `<div><label>${esc(l)}</label><select data-b="${k}">${o.map(v => `<option ${v===(st.boat[k]||'')?'selected':''}>${v}</option>`).join('')}</select></div>`
          : o === 'date' ? `<div><label>${esc(l)}</label><div class="expd"><input type="date" class="exd" data-b="${k}" value="${esc(st.boat[k])}"><span class="st">${chip(st.boat[k])}</span></div></div>`
          : `<div><label>${esc(l)}</label><input data-b="${k}" value="${esc(st.boat[k])}"></div>`).join('')}</div></div>
      <div class="card" id="insCard"><h2>Boat insurance</h2>
        <div class="grid"><div><label>Insurer</label><input data-i="insurer" value="${esc(st.ins.insurer)}"></div>
          <div><label>Insurance renewal date *</label><div class="expd"><input type="date" class="exd" data-i="renew" value="${esc(st.ins.renew)}"><span class="st">${chip(st.ins.renew)}</span></div></div></div>
        <label class="check" style="margin-top:8px"><input type="checkbox" data-i="pl" ${st.ins.pl?'checked':''}> I confirm the boat's insurance policy includes at least <b>$10 million public liability</b> cover. *</label></div>
      ${D.forms.map(f => `<div class="card"><h2>${esc(f.title)}</h2><p class="muted">${esc(f.sub)} · ${esc(f.ver)}</p>
        ${f.sections.map(s => `<h3>${esc(s.title)}</h3>${s.items.map(itemHtml).join('')}`).join('')}${exTable(f)}</div>`).join('')}
      <div class="card"><h3>Declaration by person in charge</h3><div class="decl">${esc(D.decl.pic)}${med?'<br><br>'+esc(D.decl.med):''}</div>
        <label class="check"><input type="checkbox" data-s="declared" ${st.declared?'checked':''}> I agree with the declaration above and confirm the information in this self-check is correct.</label>
        <div style="max-width:340px;margin-top:8px"><label>Full name of person in charge *</label><input data-s="declName" value="${esc(st.declName)}"></div></div>
      <div id="errs"></div>
      <div class="row"><button class="primary" data-act="submit">Check &amp; send to auditor</button><span class="spacer"></span><button class="danger" data-act="reset">Clear form</button></div>
    </main>`;
  }
  const subject = () => 'Safety self-check – '+D.yacht.name+(D.yacht.sailNo?' ('+D.yacht.sailNo+')':'');
  async function makeCode(){
    const a = {}, n = {}, e = {}, x = {};
    D.forms.forEach(f => a[f.key] = f.order.map(id => { const r = st.answers[id]; return r && r.a ? {yes:'y', no:'n', na:'a'}[r.a] : '-'; }).join(''));
    for(const id in st.answers){ const r = st.answers[id]; if(r.n) n[id] = r.n; if(r.e && r.a !== 'na') e[id] = r.e; }
    for(const k in st.earliest) x[k] = st.earliest[k].v;
    const p = {v:2, t:'precheck', yachtId:D.yacht.id, yacht:{name:D.yacht.name, sailNo:D.yacht.sailNo, club:D.yacht.club, category:D.yacht.category},
      sig:Object.fromEntries(D.forms.map(f => [f.key, f.sig])), sel:D.sel, owner:{name:st.owner, email:st.email, phone:st.phone}, boat:st.boat, ins:st.ins,
      submittedAt:st.submittedAt, a, n, e, x, declName:st.declName};
    const json = JSON.stringify(p);
    try{
      const s = new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      const buf = new Uint8Array(await new Response(s).arrayBuffer());
      let bin = ''; buf.forEach(b => bin += String.fromCharCode(b));
      return 'YA2Z:' + btoa(bin) + ':END';
    }catch(err){ return 'YA2:' + btoa(unescape(encodeURIComponent(json))) + ':END'; }
  }
  function message(full){
    const L = [subject(), 'Club: '+(D.yacht.club||'-')+'   Category: '+D.yacht.category,
      'Owner: '+st.owner+'   '+st.email+'   '+(st.phone||''), 'Submitted: '+new Date(st.submittedAt).toLocaleString('en-AU'), ''];
    const no = allItems.filter(i => (st.answers[i.id]||{}).a === 'no');
    L.push(no.length ? 'ITEMS ANSWERED NO:' : 'All items answered Yes or N/A.');
    no.forEach(i => L.push(' - '+i.reg+' '+i.text+': '+st.answers[i.id].n));
    if(full){
      L.push('', 'BOAT INSURANCE: '+(st.ins.insurer||'insurer not given')+' – renewal '+fmt(st.ins.renew)+(status(st.ins.renew)==='soon'?' (RENEWS SOON)':'')+' – $10M public liability '+(st.ins.pl?'confirmed':'NOT confirmed'));
      if(parseInt(st.boat.epirbUnits) > 0) L.push('EPIRB: '+st.boat.epirbUnits+' unit(s), expires '+fmt(st.boat.epirbExpiry)+(status(st.boat.epirbExpiry)==='soon'?' (EXPIRES SOON)':'')+', AMSA registration '+(st.boat.epirbAmsa?'confirmed':'NOT confirmed'));
      L.push('', 'EARLIEST EXPIRY DATES:');
      exRows.forEach(r => { const v = (st.earliest[r.k]||{}).v; L.push(' - '+r.label+': '+(isDate(v) ? fmt(v)+(status(v)==='soon'?' (EXPIRES SOON)':'') : v)); });
      const dated = allItems.filter(i => i.ex && (st.answers[i.id]||{}).a === 'yes');
      if(dated.length){ L.push('', 'MEDICATION EXPIRY DATES:'); dated.forEach(i => L.push(' - '+i.text+': '+fmt(st.answers[i.id].e)+(status(st.answers[i.id].e)==='soon'?' (EXPIRES SOON)':''))); }
    }
    L.push('', 'Auditor: paste this whole email into the audit program (Import owner check).', st.code);
    return L.join('\n');
  }
  function mailto(){
    let body = message(true);
    if(encodeURIComponent(body).length > 1800) body = message(false);
    return 'mailto:'+encodeURIComponent(D.auditor.email)+'?subject='+encodeURIComponent(subject())+'&body='+encodeURIComponent(body);
  }
  function doneHtml(){
    return `${head}<main><div class="card"><h2>✓ Self-check complete</h2>
      <p>Thank you, ${esc(st.owner)}. Your self-check for <b>${esc(D.yacht.name)}</b> is complete and ready for your auditor${D.auditor.name?', '+esc(D.auditor.name):''} (${esc(D.auditor.email)}).</p>
      <div id="auto"></div>
      <h3>Send it to the auditor</h3>
      <ol><li>Press <b>Open email to auditor</b> – a pre-written email opens in your mail program. Press <b>Send</b>.</li>
        <li>If no email opens, or it looks cut off, press <b>Copy message</b> and paste it into a new email to <b>${esc(D.auditor.email)}</b>.</li></ol>
      <div class="row"><a class="btn primary" href="${esc(mailto())}">Open email to auditor</a><button data-act="copy">Copy message</button>
        <button data-act="download">Download a copy</button><span class="spacer"></span><button data-act="edit">Change my answers</button></div>
      <textarea id="msg" readonly rows="14" style="margin-top:12px;font-family:monospace;font-size:12px">${esc(message(true))}</textarea></div></main>`;
  }
  function render(){ app.innerHTML = st.done ? doneHtml() : formHtml(); }
  function sync(){
    if(st.done) return;
    document.querySelectorAll('[data-s]').forEach(el => st[el.dataset.s] = el.type==='checkbox' ? el.checked : el.value.trim());
    document.querySelectorAll('[data-b]').forEach(el => st.boat[el.dataset.b] = el.type === 'checkbox' ? (el.checked ? 'Yes' : '') : el.value.trim());
    document.querySelectorAll('[data-i]').forEach(el => st.ins[el.dataset.i] = el.type==='checkbox' ? el.checked : el.value.trim());
    document.querySelectorAll('[data-item]').forEach(el => { const c = el.querySelector('input:checked'), ex = el.querySelector('.exd');
      st.answers[el.dataset.item] = {a: c ? c.value : '', n: el.querySelector('.note').value.trim(), e: ex ? ex.value : ''}; });
    document.querySelectorAll('[data-ex]').forEach(tr => { const m = tr.querySelector('.exm').value; st.earliest[tr.dataset.ex] = {v: m==='date' ? tr.querySelector('.exv').value : m}; });
    persist();
  }
  function validate(){
    const errs = [];
    document.querySelectorAll('.invalid').forEach(e => e.classList.remove('invalid'));
    const bad = (el, msg) => { errs.push(msg); if(typeof el === 'string') el = document.querySelector(el); if(el) el.classList.add('invalid'); };
    if(!st.owner) bad('[data-s=owner]', 'Enter the owner name.');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(st.email)) bad('[data-s=email]', 'Enter a valid email address.');
    allItems.forEach(i => { const a = st.answers[i.id] || {}, el = document.querySelector('[data-item="'+i.id+'"]'), t = (i.reg?i.reg+' ':'')+i.text;
      if(!a.a) bad(el, 'Answer Yes / No / N/A: '+t);
      else if(a.a === 'no' && !a.n) bad(el && el.querySelector('.note'), 'Explain why this is not on board / compliant: '+t);
      else if(a.a === 'yes' && i.ex && !a.e) bad(el && el.querySelector('.exd'), 'Enter the expiry date: '+t);
      else if(a.a === 'yes' && i.ex && status(a.e) === 'expired') bad(el && el.querySelector('.exd'), 'Expired '+fmt(a.e)+' – replace it and enter the new expiry date: '+t); });
    exRows.forEach(r => { const v = (st.earliest[r.k]||{}).v, tr = document.querySelector('[data-ex="'+r.k+'"]');
      if(!v) bad(tr && tr.querySelector('.exm'), 'Earliest expiry dates: choose Date, Hire or N/A for '+r.label+'.');
      else if(v === '' || (tr && tr.querySelector('.exm').value === 'date' && !isDate(v))) bad(tr && tr.querySelector('.exv'), 'Enter the earliest expiry date for '+r.label+'.');
      else if(isDate(v) && status(v) === 'expired') bad(tr && tr.querySelector('.exv'), r.label+' expired on '+fmt(v)+' – replace or service it and enter the new earliest expiry date.'); });
    if(parseInt(st.boat.epirbUnits) > 0){
      if(!st.boat.epirbExpiry) bad('[data-b=epirbExpiry]', 'Boat details: enter the EPIRB expiry date (or set the number of EPIRB units to 0).');
      else if(status(st.boat.epirbExpiry) === 'expired') bad('[data-b=epirbExpiry]', 'EPIRB expired on '+fmt(st.boat.epirbExpiry)+' – replace the battery/unit and enter the new expiry date.');
      if(!st.boat.epirbAmsa) bad('[data-b=epirbAmsa]', 'Boat details: confirm your EPIRB(s) are registered with AMSA.');
    }
    if(!st.ins.renew) bad('[data-i=renew]', 'Boat insurance: enter the insurance renewal date.');
    else if(status(st.ins.renew) === 'expired') bad('[data-i=renew]', 'Boat insurance renewal date '+fmt(st.ins.renew)+' has passed – renew the policy and enter the new renewal date.');
    if(!st.ins.pl) bad('[data-i=pl]', 'Boat insurance: confirm the policy includes at least $10 million public liability cover.');
    if(!st.declared) bad('[data-s=declared]', 'Tick the declaration.');
    if(!st.declName) bad('[data-s=declName]', 'Enter the full name of the person in charge.');
    return errs;
  }
  async function submit(){
    sync();
    const errs = validate(), box = document.getElementById('errs');
    if(errs.length){
      box.innerHTML = `<div class="banner badb"><b>Please fix ${errs.length} thing${errs.length>1?'s':''} before sending:</b><ul>${errs.map(e => '<li>'+esc(e)+'</li>').join('')}</ul></div>`;
      (document.querySelector('.invalid') || box).scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
    st.submittedAt = new Date().toISOString(); st.code = await makeCode(); st.done = true; persist(); render(); scrollTo(0,0);
    if(D.web3formsKey) autoSend();
  }
  function autoSend(){
    const box = document.getElementById('auto');
    box.innerHTML = '<div class="banner">Sending to your auditor…</div>';
    fetch('https://api.web3forms.com/submit', {method:'POST', headers:{'Content-Type':'application/json', Accept:'application/json'},
      body:JSON.stringify({access_key:D.web3formsKey, subject:subject(), from_name:st.owner, replyto:st.email, message:message(true)})})
      .then(r => r.json()).then(j => { if(!j.success) throw new Error(j.message);
        box.innerHTML = '<div class="banner" style="background:var(--okbg);color:var(--ok)"><b>Sent ✓</b> Your self-check has been sent to the auditor automatically. You don\'t need to do anything else.</div>'; })
      .catch(() => { box.innerHTML = '<div class="banner badb">Automatic sending didn\'t work (you may be offline). Please use <b>Open email to auditor</b> below.</div>'; });
  }
  function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
  document.addEventListener('input', e => {
    if(st.done) return;
    const t = e.target;
    if(t.classList.contains('exm')){ const tr = t.closest('tr'); tr.querySelector('.exv').hidden = t.value !== 'date'; }
    sync();
    if(t.classList.contains('exd')) t.parentNode.querySelector('.st').innerHTML = chip(t.value);
    if(t.classList.contains('exv') || t.classList.contains('exm')){ const tr = t.closest('tr'), v = (st.earliest[tr.dataset.ex]||{}).v; tr.querySelector('.st').innerHTML = isDate(v) ? chip(v) : ''; }
    if(t.type === 'radio'){ const n = t.closest('.item').querySelector('.note'); n.placeholder = t.value==='no' ? 'Required: what is missing and what you are doing about it' : 'Comment (optional)'; }
  });
  document.addEventListener('change', e => { if(e.target.classList.contains('exm')) e.target.dispatchEvent(new Event('input', {bubbles:true})); else sync(); });
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if(!b) return;
    const act = b.dataset.act;
    if(act === 'submit') submit();
    if(act === 'reset' && confirm('Clear all your answers and start again?')){ st = fresh(); persist(); render(); }
    if(act === 'edit'){ st.done = false; persist(); render(); }
    if(act === 'copy'){ const t = document.getElementById('msg'); t.select();
      (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => toast('Copied – paste into an email to '+D.auditor.email), () => { document.execCommand('copy'); toast('Copied'); }); }
    if(act === 'download'){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([message(true)], {type:'text/plain'}));
      a.download = D.yacht.name.replace(/[^\w\-]+/g,'-')+'-self-check.txt'; document.body.appendChild(a); a.click(); a.remove(); }
  });
  render();
}
(async () => {
  const msg = t => document.getElementById('app').innerHTML = '<header><div><h1>Safety equipment self-check</h1></div></header><main><div class="card">' + t + '</div></main>';
  const m = location.hash.match(/^#([zj])=([A-Za-z0-9_-]+)/);
  if(!m) return msg('<h2>Please use the link from your auditor</h2><p>This form opens from the link in the email your equipment auditor sent you. Open that email and click the link.</p>');
  try{
    let s = m[2].replace(/-/g,'+').replace(/_/g,'/'); while(s.length % 4) s += '=';
    const bin = atob(s); let P;
    if(m[1] === 'z'){ const st = new Blob([Uint8Array.from(bin, ch => ch.charCodeAt(0))]).stream().pipeThrough(new DecompressionStream('deflate-raw')); P = JSON.parse(await new Response(st).text()); }
    else P = JSON.parse(decodeURIComponent(escape(bin)));
    window.DATA = ownerDataFromPayload(P, RAW, C);
  }catch(e){ return msg('<h2>This link is incomplete</h2><p>The link may have been cut off when it was copied. Please go back to the email from your auditor and click the full link, or ask them to send it again.</p>'); }
  if(DATA.mismatch.length) return msg('<h2>This form needs updating</h2><p>Your auditor\'s checklist has changed since this page was published. Please let your auditor know so they can send you an updated link.</p>');
  ownerApp();
})();
</script></body></html>
